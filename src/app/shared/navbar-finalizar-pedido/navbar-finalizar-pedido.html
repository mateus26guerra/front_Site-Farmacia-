<nav class="navbar">
  <div class="logo" (click)="telaInicial()">
    + PROMOFARMA
  </div>
        <!-- CESTA -->
<div class="action-item cart" (click)="abrirCarrinho()">
  <i data-lucide="shopping-cart"></i>

  <div class="action-text">
    <small>Cesta</small>
    <strong>
      {{ cartService.totalValor() | currency:'BRL' }}
    </strong>
  </div>

  @if (cartService.totalItens() > 0) {
    <span class="badge">
      {{ cartService.totalItens() }}
    </span>
  }
</div>
</nav>

@if (showCart) {
  <app-cart (close)="showCart = false"></app-cart>
}
