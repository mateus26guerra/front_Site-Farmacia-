<h2 class="section-title">Produtos Disponíveis</h2>

<div class="carousel-wrapper">

  <button class="carousel-btn" (click)="scrollLeft()">❮</button>

  <div class="carousel" #carouselContainer>

    <div class="products">

      @for (p of produtos; track p.id) {

        <div class="product-card">

          <button class="add-btn" (click)="adicionar(p)">+</button>

          <!-- imagem vem direto -->
          <img
            [src]="'data:image/png;base64,' + p.imagem"
            [alt]="p.nomeProduto"
          />

          <div class="info">

            <h3 class="product-name">
              {{ p.nomeProduto }}
            </h3>

            <p class="price">
              {{ p.valorFinal | currency:'BRL' }}
            </p>

          </div>

          <div class="variacoes">
            <span class="variacao-tag">
              <!-- se não tiver mais variação, remove ou adapta -->
              ID: {{ p.produtoId }}
            </span>
          </div>

        </div>

      }

    </div>

  </div>

  <button class="carousel-btn" (click)="scrollRight()">❯</button>

</div>
