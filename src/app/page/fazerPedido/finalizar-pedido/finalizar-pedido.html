<app-navbar-finalizar-pedido></app-navbar-finalizar-pedido>

<div class="page-wrapper">
  <div class="card">

    <h2 class="card-title">
      Finalize seu Pedido 🚀
    </h2>

    <form (ngSubmit)="finalizar()">

      <div class="form-grid">

        <div class="form-group full">
          <label>Nome Completo</label>
          <input type="text" [(ngModel)]="cliente" name="cliente" required>
        </div>

        <div class="form-group">
          <label>Telefone (WhatsApp)</label>
          <input type="text" [(ngModel)]="telefone" name="telefone" required>
        </div>

        <div class="form-group">
          <label>Bairro</label>
          <select [(ngModel)]="bairro" name="bairro" required>
            <option value="" disabled selected>Selecione</option>
            <option *ngFor="let b of bairros" [value]="b">{{ b }}</option>
          </select>
        </div>

        <div class="form-group full">
          <label>Endereço</label>
          <input type="text" [(ngModel)]="endereco" name="endereco" required>
        </div>

        <div class="form-group full">
          <label>Complemento</label>
          <input type="text" [(ngModel)]="complemento" name="complemento">
        </div>

        <div class="form-group">
          <label>Forma de Pagamento</label>
          <select [(ngModel)]="formaDePagamento" name="formaDePagamento" required>
            <option value="" disabled selected>Selecione</option>
            <option *ngFor="let f of formas" [value]="f">{{ f }}</option>
          </select>
        </div>

      </div>

      <div class="button-group">
        <button type="submit" class="btn primary">
          Finalizar Pedido
        </button>
      </div>

    </form>
  </div>
</div>
