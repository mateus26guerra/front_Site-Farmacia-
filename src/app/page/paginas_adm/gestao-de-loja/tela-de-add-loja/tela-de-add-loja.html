<app-navbar-administrador></app-navbar-administrador>
<app-sidebar></app-sidebar>

<form (ngSubmit)="salvar()" class="card">
  <h2>Cadastro de Loja</h2>
  <p class="card-subtitle">Preencha as informações abaixo para cadastrar uma nova loja.</p>
  <hr class="section-divider">

  <div class="field">
    <label for="nome">Nome da Loja</label>
    <input type="text" [(ngModel)]="nome" name="nome" id="nome" placeholder="Ex: Farmácia Central">
    <span class="hint">Digite o nome principal da loja.</span>
  </div>

  <div class="field-row">
    <div class="field">
      <label for="cep">CEP</label>
      <input type="text" [(ngModel)]="cep" name="cep" id="cep" placeholder="Ex: 01310-100">
      <span class="hint">CEP do endereço da loja.</span>
    </div>
    <div class="field">
      <label for="cnpj">CNPJ</label>
      <input type="text" [(ngModel)]="cnpj" name="cnpj" id="cnpj" placeholder="Ex: 00.000.000/0001-00">
      <span class="hint">CNPJ da loja.</span>
    </div>
  </div>

  <div class="field-row">
    <div class="field">
      <label for="telefone">Telefone</label>
      <input type="text" [(ngModel)]="telefone" name="telefone" id="telefone" placeholder="Ex: (11) 99999-9999">
      <span class="hint">Telefone de contato.</span>
    </div>
    <div class="field">
      <label for="tipoAtendimento">Tipo de Atendimento</label>
      <div class="select-wrapper">
        <select [(ngModel)]="tipoAtendimento" name="tipoAtendimento" id="tipoAtendimento">
          <option value="">Selecione uma opção</option>
          <option value="ENTREGA">Entrega</option>
          <option value="RETIRADA">Retirada</option>
          <option value="AMBOS">Ambos</option>
        </select>
      </div>
      <span class="hint">Escolha o tipo de atendimento.</span>
    </div>
  </div>

  <div class="field">
    <label for="imagemUrl">Imagem (URL)</label>
    <input type="text" [(ngModel)]="imagemUrl" name="imagemUrl" id="imagemUrl" placeholder="https://exemplo.com/imagem.jpg">
    <span class="hint">Link direto para a imagem da loja.</span>
  </div>

  <div class="actions">
    <button type="button" class="btn btn-cancel" (click)="cancelar()">Cancelar</button>
    <button type="submit" class="btn btn-save">Salvar Loja</button>
  </div>
</form>
