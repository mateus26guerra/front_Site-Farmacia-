<app-navbar-administrador></app-navbar-administrador>
<app-sidebar></app-sidebar>

<div class="page-wrapper">

<div class="card">

<h2 class="title">
Gerenciamento de Produtos
</h2>

<div class="top-controls">

<input
class="search"
type="text"
placeholder="Pesquisar produtos..."
>

<select
class="loja-select"
(change)="selecionarLoja($event)"
>

<option value="">Todas as lojas</option>

<option *ngFor="let l of lojas" [value]="l.id">
{{l.nome}}
</option>

</select>

<button
class="btn show-all"
(click)="mostrarTudo()"
>
Mostrar estoque
</button>

<button
class="btn show-all"
(click)="mostrarTodosProdutos()"
>
Todos produtos
</button>

</div>

<div class="action-buttons">

<button class="btn primary" [routerLink]="['/addProduto']">
Novo Produto
</button>

<button class="btn secondary" [routerLink]="['/addCategoria']">
Nova Categoria
</button>

<button class="btn success" [routerLink]="['/addestoque']">
Produto de Estoque
</button>

</div>

</div>

<!-- ================================= -->
<!-- TABELA ESTOQUE -->
<!-- ================================= -->

<div *ngIf="modo === 'estoque'" class="product-table">

<div class="table-header">

<div>Imagem</div>
<div>Produto</div>
<div>Loja</div>
<div>Estoque</div>
<div>Preço</div>
<div>Ações</div>

</div>

<div
class="table-row"
*ngFor="let p of produtosFiltrados"
>

<div class="col-image">
<img [src]="'data:image/webp;base64,' + p.imagem">
</div>

<div class="col-name">
{{p.nomeProduto}}
</div>

<div class="col-store">
{{p.nomeLoja}}
</div>

<div class="col-stock">
{{p.quantidade}}
</div>

<div class="col-price">
R$ {{p.valorFinal}}
</div>

<div class="col-actions">

<button class="btn-minus" (click)="diminuirEstoque(p)">-</button>

<span class="stock-number">
{{p.quantidade}}
</span>

<button class="btn-plus" (click)="aumentarEstoque(p)">+</button>

<button
class="btn-update"
*ngIf="estoqueAlterado(p)"
(click)="atualizarEstoque(p)"
>
Salvar
</button>

</div>

</div>

</div>

<!-- ================================= -->
<!-- TABELA PRODUTOS -->
<!-- ================================= -->

<div *ngIf="modo === 'produtos'" class="product-table">

<div class="produtos-header">

<div>Imagem</div>
<div>Produto</div>
<div>Variação</div>
<div>Categoria</div>

</div>

<div
class="produtos-row"
*ngFor="let p of todosProdutos"
>

<div class="col-image">
<img [src]="'data:image/png;base64,' + p.imagemBase64">
</div>

<div class="col-name">
{{p.name}}
</div>

<div>
{{p.variacao}}
</div>

<div>
{{p.categoriaNome}}
</div>

</div>

</div>
